<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>にゃんこダメージ計算</title>
　　<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>にゃんこ大戦争 ダメージ計算</h1>

<h3>味方キャラ</h3>

<select id="myCat">
    <option value="bahamut">覚醒のネコムート</option>
    
</select>

<h3>レベル</h3>

<input
    id="level"
    type="number"
    value="30"
    min="1"
>Lv

<h3>敵キャラ</h3>

<select id="enemy">
    <option value="kuro">クロサワ監督</option>
    <option value="bunbun">ぶんぶん先生</option>
</select>

<h3>敵倍率</h3>

<input
    id="enemyMultiplier"
    type="number"
    value="100"
    min="1"
>%

<h4>
<button id="calc">
計算
</button>
</h4>

<h5>結果</h5>

<p id="result"></p>

<script src="data/search_data1_ja.js"></script>
<script src="data/unit_formal.js"></script>
<script src="JDB.js"></script>
<script src="damage.js"></script>
<script src="script.js"></script>

</body>

</html>
